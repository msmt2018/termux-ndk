name: Upstream patch applicability

on:
  push:
    branches:
      - multi-host-architecture-patches
    paths:
      - "patches/llvm_android/**"
      - "patches/ndk/**"
      - ".github/workflows/upstream-patch-applicability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-patch-applicability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llvm-android-patches:
    name: LLVM Android patch set (${{ matrix.host_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host_arch: aarch64
            host_triple: aarch64-unknown-linux-musl
            config_patch: configs.py.patch
          - host_arch: x86_64
            host_triple: x86_64-unknown-linux-musl
            config_patch: configs.py.patch
          - host_arch: armv7
            host_triple: arm-unknown-linux-musleabihf
            config_patch: configs.py.patch
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4

      - name: Fetch pinned AOSP LLVM Android source
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/aosp/toolchain
          git clone --depth=1 --filter=blob:none \
            --branch mirror-goog-llvm-r563880-release \
            https://android.googlesource.com/toolchain/llvm_android \
            /tmp/aosp/toolchain/llvm_android
          git -C /tmp/aosp/toolchain/llvm_android checkout 19756bd1d4ffca122636e553ab43b4befe827183

      - name: Check and apply LLVM Android patches
        env:
          TERMUX_NDK_HOST_ARCH: ${{ matrix.host_arch }}
        run: |
          set -Eeuo pipefail
          cd /tmp/aosp/toolchain/llvm_android
          echo "LLVM checkout root: $PWD"
          find . -maxdepth 3 -type f -name "paths.py" -o -name "configs.py" | sort
          patch -p1 < "$GITHUB_WORKSPACE/patches/llvm_android/builders.py.patch"
          grep -n -C 8 "LLVM_TARGETS_TO_BUILD" src/llvm_android/base_builders.py
          patch -p1 < "$GITHUB_WORKSPACE/patches/llvm_android/base_builders.py.patch"
          patch -p1 < "$GITHUB_WORKSPACE/patches/llvm_android/${{ matrix.config_patch }}"
          python3 -m compileall -q src/llvm_android

  ndk-host-patches:
    name: NDK host patch set (${{ matrix.host_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host_arch: aarch64
            host_triple: aarch64-unknown-linux-musl
            toolchain_patch: toolchains.py.patch
          - host_arch: x86_64
            host_triple: x86_64-unknown-linux-musl
            toolchain_patch: toolchains.py.patch
          - host_arch: armv7
            host_triple: arm-unknown-linux-musleabihf
            toolchain_patch: toolchains.py.patch
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4

      - name: Fetch AOSP NDK source
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --filter=blob:none --branch main \
            https://android.googlesource.com/platform/ndk /tmp/aosp-ndk
          git -C /tmp/aosp-ndk checkout c4bdd155116a9b42767534b35e93f83a91e4a06f

      - name: Check and apply NDK host patches
        env:
          TERMUX_NDK_HOST_ARCH: ${{ matrix.host_arch }}
          TERMUX_NDK_HOST_TRIPLE: ${{ matrix.host_triple }}
        run: |
          set -Eeuo pipefail
          cd /tmp/aosp-ndk
          patch -p1 < "$GITHUB_WORKSPACE/patches/ndk/hosts.py.patch"
          patch -p1 < "$GITHUB_WORKSPACE/patches/ndk/${{ matrix.toolchain_patch }}" || { cat ndk/toolchains.py.rej; exit 1; }
          python3 -m py_compile ndk/hosts.py ndk/toolchains.py
          python3 - <<'PY'
          import os
          from types import SimpleNamespace
          from unittest.mock import patch
          from ndk.hosts import Host, host_to_tag
          from ndk.toolchains import HOST_TRIPLE_MAP

          assert HOST_TRIPLE_MAP[Host.Linux] == os.environ["TERMUX_NDK_HOST_TRIPLE"], (
              HOST_TRIPLE_MAP[Host.Linux], os.environ["TERMUX_NDK_HOST_TRIPLE"]
          )

          for tag in ("linux-x86_64", "android-arm64", "android-armv7"):
              os.environ["TERMUX_NDK_HOST_TAG"] = tag
              assert host_to_tag(Host.Linux) == tag, tag

          os.environ.pop("TERMUX_NDK_HOST_TAG", None)
          for machine, tag in (
              ("x86_64", "linux-x86_64"),
              ("aarch64", "android-arm64"),
              ("armv7l", "android-armv7"),
              ("armv8l", "android-armv7"),
          ):
              with patch("ndk.hosts.os.uname", return_value=SimpleNamespace(machine=machine)):
                  assert host_to_tag(Host.Linux) == tag, (machine, tag)

          # A 32-bit process may run on a 64-bit ARM kernel.
          with patch("ndk.hosts.os.uname", return_value=SimpleNamespace(machine="aarch64")):
              with patch("ndk.hosts.struct.calcsize", return_value=4):
                  assert host_to_tag(Host.Linux) == "android-armv7"

          os.environ["TERMUX_NDK_HOST_TAG"] = "invalid"
          try:
              host_to_tag(Host.Linux)
          except ValueError:
              pass
          else:
              raise AssertionError("invalid host tag was accepted")
          print("PASS: NDK host triple, host tag override, auto-detection and rejection")
          PY
