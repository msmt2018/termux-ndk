name: Host script validation

on:
  push:
    branches:
      - multi-host-architecture-patches
    paths:
      - "patches/build_stage2.sh"
      - "patches/validate_host_toolchain.sh"
      - "patches/**"
      - ".github/workflows/host-script-validation.yml"
  pull_request:
    paths:
      - "patches/build_stage2.sh"
      - "patches/validate_host_toolchain.sh"
      - ".github/workflows/host-script-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-script-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-validation:
    name: Bash syntax and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n patches/build_stage2.sh
          bash -n patches/build_native_tools.sh
          bash -n patches/build_all_hosts.sh
          bash -n patches/validate_host_toolchain.sh
          bash -n patches/host-env.sh
          bash -n patches/validate_stage2_install.sh
          bash -n patches/validate_stage2_inputs.sh
          python3 - <<'PY'
          from pathlib import Path
          text = Path("patches/build_stage2.sh").read_text()
          required = (
              "-DLLVM_HOST_TRIPLE=${MUSL_TRIPLE}",
              "-DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER",
              "-DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY",
              "-DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY",
              "-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY",
          )
          for option in required:
              assert option in text, option
          assert '"-DCMAKE_FIND_ROOT_PATH=${SYSROOT};' in text
          print("PASS: Stage2 target triple and target-only CMake dependency search")
          PY
          python3 - <<'PY'
          from pathlib import Path
          text = Path("patches/build_stage2.sh").read_text()
          lines = text.splitlines()
          swig = next(line for line in lines if "-DSWIG_EXECUTABLE=" in line)
          assert len(swig) - len(swig.rstrip("\\\\")) == 1, repr(swig)
          for option in ("-DLLVM_ENABLE_TERMINFO=ON", "-DLLVM_ENABLE_LIBEDIT=ON", "-DLLVM_ENABLE_LIBXML2=ON"):
              assert option in text, option
          print("PASS: Stage2 CMake continuation and LLDB dependency feature gates")
          PY

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck --severity=error patches/build_stage2.sh patches/build_native_tools.sh patches/build_all_hosts.sh patches/validate_host_toolchain.sh patches/host-env.sh patches/validate_stage2_install.sh patches/validate_stage2_inputs.sh

      - name: Validate unified diff hunk counts
        run: python3 patches/validate_patch_hunks.py

      - name: Test static archive architecture validation
        shell: bash
        run: |
          set -Eeuo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          mkdir -p "$temp/deps" "$temp/python/lib"
          printf 'int archive_probe(void) { return 0; }\n' > "$temp/probe.c"
          cc -c "$temp/probe.c" -o "$temp/probe.o"
          ar rcs "$temp/probe.a" "$temp/probe.o"
          triple="x86_64-unknown-linux-musl"
          for name in libz libxml2 libzstd liblzma libedit; do
            mkdir -p "$temp/deps/$name-$triple-install/lib"
            cp "$temp/probe.a" "$temp/deps/$name-$triple-install/lib/$name.a"
          done
          mkdir -p "$temp/deps/libncurses-$triple-install/lib"
          for name in libncurses libform libpanel; do
            cp "$temp/probe.a" "$temp/deps/libncurses-$triple-install/lib/$name.a"
          done
          cp "$temp/probe.a" "$temp/python/lib/libpython3.12.a"
          HOST_ARCH=x86_64 DEPS_PREFIX="$temp/deps" PYTHON_TARGET_ROOT="$temp/python" bash patches/validate_stage2_inputs.sh
          if HOST_ARCH=aarch64 DEPS_PREFIX="$temp/deps" PYTHON_TARGET_ROOT="$temp/python" bash patches/validate_stage2_inputs.sh; then
            echo "validator accepted x86_64 archives for AArch64" >&2
            exit 1
          fi

      - name: Check host environment mappings
        shell: bash
        run: |
          set -Eeuo pipefail
          HOST_ARCH=aarch64 bash -c 'source patches/host-env.sh "$HOST_ARCH"; test "$TERMUX_NDK_HOST_TAG" = android-arm64; test "$TERMUX_NDK_HOST_TRIPLE" = aarch64-unknown-linux-musl'
          HOST_ARCH=x86_64 bash -c 'source patches/host-env.sh "$HOST_ARCH"; test "$TERMUX_NDK_HOST_TAG" = linux-x86_64; test "$TERMUX_NDK_HOST_TRIPLE" = x86_64-unknown-linux-musl'
          HOST_ARCH=armv7 bash -c 'source patches/host-env.sh "$HOST_ARCH"; test "$TERMUX_NDK_HOST_TAG" = android-armv7; test "$TERMUX_NDK_HOST_TRIPLE" = arm-unknown-linux-musleabihf'

      - name: Check unsupported architecture fails safely
        shell: bash
        run: |
          set -Eeuo pipefail
          if HOST_ARCH=unsupported bash patches/validate_host_toolchain.sh; then
            echo "validator unexpectedly accepted an unsupported architecture" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
