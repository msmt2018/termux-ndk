name: Host script validation

on:
  push:
    branches:
      - multi-host-architecture-patches
    paths:
      - "patches/build_stage2.sh"
      - "patches/validate_host_toolchain.sh"
      - "patches/**"
      - ".github/workflows/host-script-validation.yml"
  pull_request:
    paths:
      - "patches/build_stage2.sh"
      - "patches/validate_host_toolchain.sh"
      - ".github/workflows/host-script-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-script-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-validation:
    name: Bash syntax and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n patches/build_stage2.sh
          bash -n patches/validate_host_toolchain.sh
          bash -n patches/host-env.sh
          bash -n patches/validate_stage2_install.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck --severity=error patches/build_stage2.sh patches/validate_host_toolchain.sh patches/host-env.sh patches/validate_stage2_install.sh

      - name: Validate unified diff hunk counts
        run: python3 patches/validate_patch_hunks.py

      - name: Check host environment mappings
        shell: bash
        run: |
          set -Eeuo pipefail
          HOST_ARCH=aarch64 bash -c 'source patches/host-env.sh "$HOST_ARCH"; test "$TERMUX_NDK_HOST_TAG" = android-arm64; test "$TERMUX_NDK_HOST_TRIPLE" = aarch64-unknown-linux-musl'
          HOST_ARCH=x86_64 bash -c 'source patches/host-env.sh "$HOST_ARCH"; test "$TERMUX_NDK_HOST_TAG" = linux-x86_64; test "$TERMUX_NDK_HOST_TRIPLE" = x86_64-unknown-linux-musl'
          HOST_ARCH=armv7 bash -c 'source patches/host-env.sh "$HOST_ARCH"; test "$TERMUX_NDK_HOST_TAG" = android-armv7; test "$TERMUX_NDK_HOST_TRIPLE" = arm-unknown-linux-musleabihf'

      - name: Check unsupported architecture fails safely
        shell: bash
        run: |
          set -Eeuo pipefail
          if HOST_ARCH=unsupported bash patches/validate_host_toolchain.sh; then
            echo "validator unexpectedly accepted an unsupported architecture" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
